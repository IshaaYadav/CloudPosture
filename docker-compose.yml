version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - AWS_PROFILE=${AWS_PROFILE:-cloud-posture-scanner}
      - AWS_REGION=${AWS_REGION:-ap-southeast-2}
      - POSTURE_RESULTS_BUCKET=${POSTURE_RESULTS_BUCKET}
      - APP_ENV=${APP_ENV:-development}
      - DEBUG=${DEBUG:-false}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    volumes:
      - ~/.aws:/root/.aws:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: cloud-posture-scanner

